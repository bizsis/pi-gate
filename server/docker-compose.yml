services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pigate-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
    networks:
      - pigate

  db:
    image: postgres:16-alpine
    container_name: pigate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pigate
      POSTGRES_USER: pigate
      POSTGRES_PASSWORD: KecskesKaposzta
    volumes:
      - pigate-db-data:/var/lib/postgresql/data
    networks:
      - pigate

networks:
  pigate:
    driver: bridge

volumes:
  pigate-db-data:
